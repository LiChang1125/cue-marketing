<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>脉动 · CUE</title><link rel="stylesheet" href="./reader.css"><style>
body{margin:0;color:var(--ink);background:var(--bg)}.edition{max-width:1500px;margin:auto;display:grid;grid-template-columns:184px minmax(0,1fr);gap:clamp(18px,3vw,48px);padding:0 22px}.reader-rail{border-right:1px solid var(--line)}.rail-inner{position:sticky;top:0;padding:24px 14px 22px 0}.rail-brand{display:inline-flex;margin:0 10px 22px}.rail-brand img{width:65px;height:32px;object-fit:contain}.reader-rail nav section{margin-bottom:22px}.reader-rail nav p{font-size:11px;color:var(--ink-3);margin:0 12px 7px;letter-spacing:.12em}.reader-rail nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;font-size:14px;border-radius:9px;color:var(--ink-3)}.reader-rail nav a.active,.reader-rail nav a:hover{background:var(--well);color:var(--accent)}.reader-rail nav a.active{font-weight:650}.edition main{min-width:0;padding:24px 0}.edition form{display:flex;margin-bottom:20px;gap:8px}.edition form input{padding:9px 14px;border:1px solid var(--line);border-radius:10px;min-width:0;flex:1}.edition form button{padding:8px 16px;border-radius:10px;background:var(--ink);color:var(--bg)}@media(max-width:740px){.edition{display:block;padding:0 14px}.reader-rail{border:0;border-bottom:1px solid var(--line)}.rail-inner{position:static;padding:5px 0}.rail-brand,.reader-rail nav p{display:none}.reader-rail nav{display:flex;overflow-x:auto;gap:4px;scrollbar-width:thin}.reader-rail nav section{display:contents}.reader-rail nav a{flex:none;gap:5px;padding:8px;font-size:13px}.reader-rail nav svg{width:15px}.edition main{padding:14px 0}}
</style></head><body><div id="root"></div><script type="module" src="./main.jsx"></script></body></html>
