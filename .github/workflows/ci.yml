name: Verify CUE
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  linux-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.public -t cue-smoke .
      - name: Start autonomous public cloud service
        run: docker run -d --name cue-smoke -p 127.0.0.1:4173:4173 -e CUE_ACCOUNTS_FILE=/var/data/cue/smoke-accounts.json cue-smoke sh -c 'node scripts/smoke-private-cloud.mjs --prepare && node server/public-server.js'
      - name: Verify shared public data and automatic collector
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/api/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:4173/api/health
          docker exec cue-smoke node scripts/smoke-private-cloud.mjs

      - name: Container diagnostics
        if: always()
        run: docker logs --tail=80 cue-smoke || true
      - name: Stop test container
        if: always()
        run: docker rm -f cue-smoke || true
