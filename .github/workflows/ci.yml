name: Verify CUE
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  linux-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.public -t cue-smoke .
      - name: Start autonomous public cloud service
        run: docker run -d --name cue-smoke -p 127.0.0.1:4173:4173 cue-smoke
      - name: Verify shared public data and automatic collector
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/api/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:4173/api/health
          docker exec cue-smoke node --input-type=module -e "const r=await fetch('http://127.0.0.1:4173/api/health');const d=await r.json();if(!d.collector.lastAttempt)process.exit(1);console.log('Cloud collector started without visitor action');"
          curl --fail 'http://127.0.0.1:4173/api/curated?region=china'

      - name: Container diagnostics
        if: always()
        run: docker logs --tail=80 cue-smoke || true
      - name: Stop test container
        if: always()
        run: docker rm -f cue-smoke || true
