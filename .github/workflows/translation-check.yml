name: Check offline translation quality
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .tools/translation
          key: argos-en-zh-1.9-433e7c4f
      - run: python -m pip install -r requirements-public.txt
      - name: Verify model decoding and brand names
        run: |
          mkdir -p .artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          titles = ["QuickSnap takes Australians back to the ’80s with new ‘Time Machine’ campaign via Hello", "Mitsubishi Electric encourages Aussies to elevate everyday moments in its latest brand campaign", "CommBank brings a side of joy to banking in new Yello rewards campaign", "Anatomy of an influencer marketing deal"]
          Path('.artifacts/translation-smoke.json').write_text(json.dumps({'items':[{'title':t} for t in titles]}),encoding='utf-8')
          PY
          python scripts/localize-public-data.py --input .artifacts/translation-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('.artifacts/translation-smoke.json').read_text())
          print(json.dumps(data['items'],ensure_ascii=False))
          assert all('▁' not in row['title'] for row in data['items'])
          assert 'QuickSnap' in data['items'][0]['title']
          PY
