name: Update CUE website
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '0 0 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cue-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .tools/translation
          key: argos-en-zh-1.9-433e7c4f
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests -p test_localization.py
      - name: Install pinned TrendRadar public collector
        run: |
          python -m pip install -r requirements-public.txt
          node scripts/setup-trendradar-native.mjs
      - uses: actions/cache@v4
        with:
          path: .artifacts/trendradar-state/output
          key: native-radar-${{ github.run_id }}
          restore-keys: native-radar-
      - name: Run complete native TrendRadar application
        run: python scripts/run-trendradar-native.py
        env:
          PYTHONIOENCODING: utf-8
      - name: Collect marketing media and preserve history
        run: node scripts/refresh-public-data.mjs
      - name: Translate English headlines and summaries locally
        run: python scripts/localize-public-data.py
      - uses: actions/cache@v4
        with:
          path: .artifacts/pages-source-cache
          key: pulse-source-index-${{ github.run_id }}
          restore-keys: pulse-source-index-
      - name: Build public website
        run: |
          npm run build -- --base=/cue-marketing/
          cp .artifacts/public-data/content-data.json dist/content-data.json
          node scripts/pages-source-index.mjs
          node scripts/export-agent-pages.mjs
          cp -r .artifacts/public-articles/media dist/media
          mkdir -p dist/licenses
          cp .artifacts/public-data/trendradar/LICENSE.txt dist/licenses/TrendRadar.txt
        env:
          VITE_PUBLIC_DATA: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
